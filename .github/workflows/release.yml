name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump (from the latest stable tag)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      stage:
        description: stable goes to mod.io; alpha/beta/rc only create a GitHub pre-release
        required: true
        type: choice
        default: stable
        options:
          - stable
          - alpha
          - beta
          - rc

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: donderjoekel/zeepkist-mod-workflows/.github/workflows/release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      stage: ${{ inputs.stage }}
      mod-id: 6488388
      project: Zeepkist.LogicScripting/Zeepkist.LogicScripting.csproj
      test-projects: |
        Zeepkist.LogicScripting.Compiler.Tests/Zeepkist.LogicScripting.Compiler.Tests.csproj
        Zeepkist.LogicScripting.Tests/Zeepkist.LogicScripting.Tests.csproj
        Zeepkist.LogicScripting.Analyzers.Tests/Zeepkist.LogicScripting.Analyzers.Tests.csproj
      pdb2mdb-extra: |
        Zeepkist.LogicScripting.Compiler.dll
    secrets: inherit
